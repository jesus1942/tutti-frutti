<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}TutiFrutti LAN{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
  :root{--bg:#fff3e0;--primary:#ff9800;--text:#333;}
  body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
  .neu{border-radius:20px;background:var(--bg);box-shadow:9px 9px 18px #e0e0e0,-9px -9px 18px #ffffff;padding:40px;margin:20px auto;max-width:400px}
  input,button{width:100%;margin:8px 0;padding:12px;border:none;border-radius:12px;background:var(--bg);
    box-shadow:inset 4px 4px 8px #e0e0e0,inset -4px -4px 8px #ffffff;outline:none}
  button{background:var(--primary);color:#fff;font-weight:bold}
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
